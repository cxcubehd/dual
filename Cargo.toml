[package]
name = "dual"
version = "0.1.0"
edition = "2024"
license = "All Rights Reserved"

[features]
default = []
client = [
    "dep:anyhow",
    "dep:bytemuck",
    "dep:clap",
    "dep:crossterm",
    "dep:env_logger",
    "dep:gltf",
    "dep:glyphon",
    "dep:image",
    "dep:ratatui",
    "dep:rust-embed",
    "dep:tokio",
    "dep:wgpu",
    "dep:winit",
    "dep:steamworks",
]
server = [
    "dep:anyhow",
    "dep:clap",
    "dep:crossterm",
    "dep:env_logger",
    "dep:ratatui",
    "dep:steamworks",
]
both = ["client", "server"]

[dependencies]
glam = { version = "0.33", features = ["serde", "rkyv", "bytecheck"] }
serde = { version = "1.0", features = ["derive"] }
rkyv = { version = "0.8", features = ["bytecheck"] }
bitflags = "2.10"
rapier3d = { version = "0.32", features = [
    "enhanced-determinism",
    "serde-serialize",
] }
log = "0.4"
thiserror = "2.0"

anyhow = { version = "1.0", optional = true }
bytemuck = { version = "1.24", features = ["derive"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
env_logger = { version = "0.11", optional = true }
gltf = { version = "1.4", optional = true }
glyphon = { version = "0.11", optional = true }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
], optional = true }
ratatui = { version = "0.30", optional = true }
rust-embed = { version = "8.11", optional = true }
tokio = { version = "1.49", features = ["full"], optional = true }
wgpu = { version = "29.0", optional = true }
winit = { version = "0.30", optional = true }
steamworks = { version = "0.13.1", optional = true }
